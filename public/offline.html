<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2b33">
    <title>ออฟไลน์ · HR PRO</title>
    <link rel="icon" href="/icons/icon-192.png">
    <style>
        :root { --bg: #f2f6f6; --surface: #fff; --text: #12262c; --soft: #4d6068; --brand: #0e8f88; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
            background: var(--bg); color: var(--text);
            font-family: "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
        }
        .card { max-width: 380px; width: 100%; text-align: center; background: var(--surface); border-radius: 22px; padding: 34px 26px; box-shadow: 0 12px 40px rgba(13, 43, 51, .14); }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { font-size: 21px; margin: 18px 0 8px; }
        p { color: var(--soft); font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
        button { font: inherit; font-weight: 600; font-size: 14px; color: #fff; background: var(--brand); border: 0; border-radius: 999px; padding: 11px 26px; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
        <p>HR PRO ต้องใช้อินเทอร์เน็ตเพื่อลงเวลาและดูข้อมูลล่าสุด ตรวจสอบ Wi-Fi หรือเน็ตมือถือแล้วลองอีกครั้ง</p>
        <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </main>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
