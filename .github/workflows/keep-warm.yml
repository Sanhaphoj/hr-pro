# Keeps the free Render demo awake.
#
# Render's free plan puts a web service to sleep after 15 minutes without
# traffic, and the next visitor waits 30-60 seconds for it to wake (and, on
# SQLite, gets a freshly seeded database). A light request every 10 minutes
# keeps it warm. One always-on free service uses ~744 of the 750 free
# instance hours a month, so this suits a single demo service only.
#
# Set the repository variable LIVE_DEMO_URL (Settings -> Secrets and
# variables -> Actions -> Variables) to change the address. GitHub pauses
# scheduled workflows after 60 days without repository activity.
name: Keep demo warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.LIVE_DEMO_URL || 'https://hr-pro-jqqx.onrender.com' }}
        run: >-
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10
          --output /dev/null --write-out 'HTTP %{http_code} in %{time_total}s\n' "$URL/up"
